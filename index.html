<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OEX Crypto</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #07111f;
      color: #fff;
      min-height: 100vh;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 7%;
      border-bottom: 1px solid #1d2a3a;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      color: #25d366;
    }

    .header-buttons {
      display: flex;
      gap: 10px;
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 8px;
      padding: 12px 20px;
      font-weight: 700;
    }

    .login-btn {
      background: transparent;
      color: white;
      border: 1px solid #34465d;
    }

    .signup-btn,
    .primary-btn {
      background: #25d366;
      color: #061018;
    }

    .hero {
      max-width: 1100px;
      margin: auto;
      padding: 100px 7%;
      text-align: center;
    }

    .hero h1 {
      font-size: clamp(42px, 7vw, 76px);
      margin-bottom: 20px;
    }

    .hero h1 span {
      color: #25d366;
    }

    .hero p {
      color: #aebdce;
      font-size: 18px;
      max-width: 650px;
      margin: 0 auto 35px;
      line-height: 1.6;
    }

    .hero-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .markets {
      max-width: 1100px;
      margin: auto;
      padding: 20px 7% 80px;
    }

    .markets h2 {
      margin-bottom: 20px;
    }

    .market-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
    }

    .coin {
      background: #0d1a2b;
      border: 1px solid #1d2a3a;
      padding: 20px;
      border-radius: 12px;
    }

    .coin-name {
      color: #aebdce;
      margin-bottom: 10px;
    }

    .coin-price {
      font-size: 23px;
      font-weight: 700;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.75);
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-box {
      width: 100%;
      max-width: 430px;
      background: #0d1a2b;
      border: 1px solid #26384d;
      border-radius: 15px;
      padding: 30px;
    }

    .modal-box h2 {
      margin-bottom: 20px;
    }

    .tabs {
      display: flex;
      margin-bottom: 20px;
      gap: 8px;
    }

    .tab {
      flex: 1;
      background: #16263a;
      color: white;
    }

    .tab.active {
      background: #25d366;
      color: #061018;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 12px;
      background: #07111f;
      border: 1px solid #34465d;
      border-radius: 8px;
      color: white;
      outline: none;
    }

    .form-button {
      width: 100%;
      margin-top: 5px;
    }

    .close {
      float: right;
      font-size: 24px;
      cursor: pointer;
      color: #aebdce;
    }

    .message {
      margin-top: 15px;
      font-size: 14px;
      color: #25d366;
      line-height: 1.5;
    }

    .footer {
      text-align: center;
      padding: 30px;
      border-top: 1px solid #1d2a3a;
      color: #73849a;
    }

    @media (max-width: 600px) {
      .header {
        padding: 18px;
      }

      .hero {
        padding: 70px 20px;
      }

      .markets {
        padding: 20px 20px 60px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="logo">OEX</div>

    <div class="header-buttons">
      <button class="login-btn" onclick="openModal('login')">Log In</button>
      <button class="signup-btn" onclick="openModal('signup')">Sign Up</button>
    </div>
  </header>

  <section class="hero">
    <h1>Trade Crypto with <span>OEX</span></h1>

    <p>
      Manage your cryptocurrency portfolio, monitor live market prices,
      and access your OEX account securely.
    </p>

    <div class="hero-actions">
      <button class="primary-btn" onclick="openModal('signup')">
        Create Account
      </button>

      <button class="login-btn" onclick="openModal('login')">
        Login
      </button>
    </div>
  </section>

  <section class="markets">
    <h2>Live Crypto Markets</h2>

    <div class="market-grid" id="marketGrid">
      Loading prices...
    </div>
  </section>

  <footer class="footer">
    © 2026 OEX Crypto
  </footer>

  <!-- AUTH MODAL -->
  <div class="modal" id="authModal">

    <div class="modal-box">

      <span class="close" onclick="closeModal()">×</span>

      <div class="tabs">
        <button class="tab active" id="loginTab" onclick="switchMode('login')">
          Login
        </button>

        <button class="tab" id="signupTab" onclick="switchMode('signup')">
          Sign Up
        </button>
      </div>

      <h2 id="authTitle">Login to OEX</h2>

      <form id="authForm">

        <div id="nameField" style="display:none;">
          <input
            type="text"
            id="displayName"
            placeholder="Full Name"
          >
        </div>

        <input
          type="email"
          id="email"
          placeholder="Email address"
          required
        >

        <input
          type="password"
          id="password"
          placeholder="Password"
          required
          minlength="6"
        >

        <button class="primary-btn form-button" type="submit">
          <span id="submitText">Login</span>
        </button>

      </form>

      <div class="message" id="message"></div>

    </div>
  </div>

<script>

  // =====================================================
  // SUPABASE CONFIGURATION
  // =====================================================

  const SUPABASE_URL = "https://fnyxxyohuywtatbjagyc.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_A3iHoZiiPZhPyTUDUDCfZQ_G0u6xvxj";
   const createClient = supabase.createClient;
  
  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


  // =====================================================
  // AUTH UI
  // =====================================================


  function openModal(mode) {
    document.getElementById("authModal").style.display = "flex";
    switchMode(mode);
  }

  function closeModal() {
    document.getElementById("authModal").style.display = "none";
    document.getElementById("message").textContent = "";
  }

  function switchMode(mode) {

    currentMode = mode;

    const loginTab = document.getElementById("loginTab");
    const signupTab = document.getElementById("signupTab");

    const nameField = document.getElementById("nameField");
    const authTitle = document.getElementById("authTitle");
    const submitText = document.getElementById("submitText");

    if (mode === "signup") {

      signupTab.classList.add("active");
      loginTab.classList.remove("active");

      nameField.style.display = "block";

      authTitle.textContent = "Create OEX Account";
      submitText.textContent = "Create Account";

    } else {

      loginTab.classList.add("active");
      signupTab.classList.remove("active");

      nameField.style.display = "none";

      authTitle.textContent = "Login to OEX";
      submitText.textContent = "Login";
    }

    document.getElementById("message").textContent = "";
  }


  // =====================================================
  // SIGNUP / LOGIN
  // =====================================================

  document
    .getElementById("authForm")
    .addEventListener("submit", async function(event) {

      event.preventDefault();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const displayName =
        document.getElementById("displayName").value.trim();

      const message =
        document.getElementById("message");

      message.textContent = "Please wait...";

      try {

        if (currentMode === "signup") {

          const { data, error } =
            await supabaseClient.auth.signUp({

              email: email,

              password: password,

              options: {
                data: {
                  display_name:
                    displayName || "OEX User"
                }
              }

            });

          if (error) {
            throw error;
          }

          if (data.session) {

            message.textContent =
              "Account created successfully. Redirecting...";

            setTimeout(() => {
             window.location.href = "dashboard2.html";
            }, 1000);

          } else {

            message.textContent =
              "Account created. Check your email to confirm your account, then log in.";
          }

        } else {

          const { data, error } =
            await supabaseClient.auth.signInWithPassword({

              email: email,

              password: password

            });

          if (error) {
            throw error;
          }

          if (!data.session) {
            throw new Error("Login session was not created.");
          }

          message.textContent =
            "Login successful. Redirecting...";

          setTimeout(() => {
            window.location.href = "dashboard2.html";
          }, 500);

        }

      } catch (error) {

        console.error(error);

        message.textContent =
          error.message || "Something went wrong.";

      }

    });


  // =====================================================
  // LIVE CRYPTO PRICES
  // =====================================================

  const coins = [
    {
      id: "bitcoin",
      name: "Bitcoin",
      symbol: "BTC"
    },
    {
      id: "ethereum",
      name: "Ethereum",
      symbol: "ETH"
    },
    {
      id: "tether",
      name: "Tether",
      symbol: "USDT"
    },
    {
      id: "binancecoin",
      name: "BNB",
      symbol: "BNB"
    },
    {
      id: "solana",
      name: "Solana",
      symbol: "SOL"
    },
    {
      id: "usd-coin",
      name: "USD Coin",
      symbol: "USDC"
    }
  ];


  async function loadPrices() {

    const grid =
      document.getElementById("marketGrid");

    try {

      const ids =
        coins.map(c => c.id).join(",");

      const response =
        await fetch(
          "https://api.coingecko.com/api/v3/coins/markets" +
          "?vs_currency=usd" +
          "&ids=" + ids +
          "&order=market_cap_desc" +
          "&per_page=20" +
          "&page=1" +
          "&sparkline=false" +
          "&price_change_percentage=24h"
        );

      if (!response.ok) {
        throw new Error("Price API unavailable");
      }

      const data = await response.json();

      grid.innerHTML = "";

      data.forEach(coin => {

        const card =
          document.createElement("div");

        card.className = "coin";

        const price =
          Number(coin.current_price)
            .toLocaleString(
              "en-US",
              {
                style: "currency",
                currency: "USD"
              }
            );

        const change =
          Number(
            coin.price_change_percentage_24h || 0
          ).toFixed(2);

        card.innerHTML = `
          <div class="coin-name">
            ${coin.name} (${coin.symbol.toUpperCase()})
          </div>

          <div class="coin-price">
            ${price}
          </div>

          <div style="margin-top:8px;color:${
            change >= 0 ? "#25d366" : "#ff5c5c"
          }">
            ${change >= 0 ? "+" : ""}${change}%
          </div>
        `;

        grid.appendChild(card);

      });

    } catch (error) {

      console.error(error);

      grid.innerHTML =
        "<p>Unable to load live prices right now.</p>";
    }
  }


  loadPrices();

  setInterval(loadPrices, 60000);


  // =====================================================
  // CHECK EXISTING SESSION
  // =====================================================

  async function checkSession() {

    const {
      data: { session }
    } = await supabaseClient.auth.getSession();

    if (session) {

      // If already logged in, you can go directly
      // to the dashboard.

      // Uncomment this if you want automatic redirect:
      //
      // window.location.href = "dashboard2.html";
    }
  }

  checkSession();

</script>

</body>
</html>
